[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hwsynth"
version = "0.3.0"
description = "Natural synthetic handwriting in almost every Unicode script: writer types, styles, pens, evolved writer banks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "fonttools>=4.40",
    "regex>=2023.0",
]

[project.optional-dependencies]
evolve = ["torch>=2.2", "torchvision>=0.17", "pymupdf>=1.24"]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[project.scripts]
hwsynth = "hwsynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwsynth = ["data/*", "data/banks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["_aside", ".tmp", "_logs", "runs"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "E402", "B905", "B007", "B008", "B019", "B023", "UP031"]
