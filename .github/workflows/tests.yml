name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libraqm0
      - run: pip install -e ".[dev]" ruff
      - run: ruff check . && ruff format --check .
      - name: Fetch fonts (font tests skip without them)
        run: |
          curl -sfL https://fonts.google.com/metadata/fonts -o gf.json && python scripts/fetch_fonts.py gf.json || echo "fonts not fetched, the font tests skip"
      - run: pytest -q
